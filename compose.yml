services:
  redis:
    image: redis:7-alpine
    container_name: fluxgate-redis
    restart: unless-stopped
    networks:
      - fluxgate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fluxgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxgate:local
    container_name: fluxgate-app
    environment:
      REDIS_ADDR: redis:6379
    command:
      - "--algorithm"
      - "${ALGORITHM:-token-bucket}"
      - "--capacity"
      - "${CAPACITY:-10}"
      - "--refill-rate"
      - "${REFILL_RATE:-2}"
      - "--limit"
      - "${LIMIT:-10}"
      - "--window"
      - "${WINDOW:-60s}"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fluxgate-network

networks:
  fluxgate-network:
    driver: bridge